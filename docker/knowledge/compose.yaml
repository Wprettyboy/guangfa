name: guangfa-knowledge

services:
  knowledge-api:
    build:
      context: C:/llm/guangfa-repo
      dockerfile: docker/knowledge/Dockerfile
    image: guangfa/knowledge-api:1.0.0
    container_name: guangfa-knowledge-api
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${KNOWLEDGE_API_PORT:-8787}:8787"
    environment:
      API_AUTH_MODE: required
      API_AUTH_API_KEYS: "${API_AUTH_API_KEYS:?API_AUTH_API_KEYS is required}"
      API_CAPABILITY_SECRET: "${API_CAPABILITY_SECRET:?API_CAPABILITY_SECRET is required}"
      API_ALLOWED_ORIGINS: "${API_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}"
      API_TRUST_PROXY: "true"
      KNOWLEDGE_API_HOST: 0.0.0.0
      KNOWLEDGE_API_PORT: 8787
      KNOWLEDGE_DATABASE_PATH: /data/knowledge.sqlite
      KNOWLEDGE_DATA_DIR: /data/knowledge
      KNOWLEDGE_PUBLIC_BASE_URL: "${KNOWLEDGE_PUBLIC_BASE_URL:-http://127.0.0.1:8787}"
      KNOWLEDGE_TENANT_MODE: required
      KNOWLEDGE_PARSER: "${KNOWLEDGE_PARSER:-mineru}"
      KNOWLEDGE_IMAGE_CAPTION_CONCURRENCY: "${KNOWLEDGE_IMAGE_CAPTION_CONCURRENCY:-4}"
      MINERU_API_URL: "${MINERU_API_URL:-http://host.docker.internal:8010}"
      MINERU_BACKEND: "${MINERU_BACKEND:-pipeline}"
      RETRIEVAL_BASE_URL: "${RETRIEVAL_BASE_URL:-http://host.docker.internal:8000/v1}"
      KNOWLEDGE_GEMINI_BASE_URL: "${KNOWLEDGE_GEMINI_BASE_URL:-}"
      KNOWLEDGE_GEMINI_MODEL: "${KNOWLEDGE_GEMINI_MODEL:-}"
      KNOWLEDGE_GEMINI_API_KEY: "${KNOWLEDGE_GEMINI_API_KEY:-}"
      KNOWLEDGE_GEMINI_PROXY_URL: "${KNOWLEDGE_GEMINI_PROXY_URL:-}"
      ONLYOFFICE_SERVER_URL: "${ONLYOFFICE_SERVER_URL:-http://host.docker.internal:8080}"
      ONLYOFFICE_PUBLIC_URL: "${ONLYOFFICE_PUBLIC_URL:-http://127.0.0.1:8080}"
      ONLYOFFICE_JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET is required}"
      OFFICE_PUBLIC_BASE_URL: "${OFFICE_PUBLIC_BASE_URL:-http://host.docker.internal:8787}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - knowledge-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  knowledge-data:
    name: guangfa-knowledge-data
