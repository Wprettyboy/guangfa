name: guangfa-mineru-amd

x-mineru-amd-common: &mineru-amd-common
  build:
    context: C:/llm/guangfa-repo
    dockerfile: docker/mineru/Dockerfile.amd
  image: guangfa/mineru-amd:3.4.4-rocm7.2.1
  restart: unless-stopped
  devices:
    - /dev/dxg:/dev/dxg
  environment:
    HSA_ENABLE_DXG_DETECTION: "1"
    HF_HUB_DISABLE_XET: "1"
    MINERU_MODEL_SOURCE: local
    MINERU_TOOLS_CONFIG_JSON: /opt/guangfa-mineru/mineru.json
    MINERU_VL_MODEL_PATH: /opt/guangfa-mineru/models/MinerU2.5-Pro-2605-1.2B
  volumes:
    - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
    - mineru-rocm:/opt/rocm:ro
    - mineru-runtime:/opt/guangfa-mineru:ro
    - mineru-modelscope:/root/.cache/modelscope:ro
    # ROCm 内核编译缓存与 MIOpen 调优库必须跨容器重建保留：全空时首解析实测 210s，命中后 10s。
    # /root/.config/miopen 存 find-db（每个卷积形状的实测最优算法），是三者中决定性的一个。
    - mineru-kernel-cache:/root/.cache/comgr
    - mineru-miopen-cache:/root/.cache/miopen
    - mineru-miopen-userdb:/root/.config/miopen
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864

services:
  mineru-vlm:
    <<: *mineru-amd-common
    profiles: ["local-vlm"]
    container_name: guangfa-mineru-vlm
    entrypoint: /opt/guangfa-mineru/venv/bin/python
    command:
      - -m
      - uvicorn
      - mineru_transformers_server:app
      - --app-dir
      - /app
      - --host
      - 0.0.0.0
      - --port
      - "30000"
    ports:
      - "127.0.0.1:${MINERU_VLM_PORT:-30000}:30000"
    healthcheck:
      test: ["CMD", "/opt/guangfa-mineru/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:30000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 3m

  mineru-api:
    <<: *mineru-amd-common
    container_name: guangfa-mineru-api
    entrypoint: /opt/guangfa-mineru/venv/bin/mineru-api
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --allow-public-http-client
    ports:
      - "127.0.0.1:${MINERU_API_PORT:-8010}:8000"
    environment:
      HSA_ENABLE_DXG_DETECTION: "1"
      HF_HUB_DISABLE_XET: "1"
      MINERU_API_MAX_CONCURRENT_REQUESTS: "1"
      MINERU_API_OUTPUT_ROOT: /data/output
      MINERU_HYBRID_BATCH_RATIO: "${MINERU_HYBRID_BATCH_RATIO:-4}"
      MINERU_MODEL_SOURCE: local
      MINERU_PROCESSING_WINDOW_SIZE: "${MINERU_PROCESSING_WINDOW_SIZE:-16}"
      MINERU_TOOLS_CONFIG_JSON: /opt/guangfa-mineru/mineru.json
      MINERU_VIRTUAL_VRAM_SIZE: "${MINERU_VIRTUAL_VRAM_SIZE:-8}"
      MINERU_VL_MODEL_PATH: /opt/guangfa-mineru/models/MinerU2.5-Pro-2605-1.2B
    volumes:
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
      - mineru-rocm:/opt/rocm:ro
      - mineru-runtime:/opt/guangfa-mineru:ro
      - mineru-modelscope:/root/.cache/modelscope:ro
      # 与 x-mineru-amd-common 保持一致：本服务重定义 volumes 会整体覆盖锚点，缓存卷必须在此重复声明。
      - mineru-kernel-cache:/root/.cache/comgr
      - mineru-miopen-cache:/root/.cache/miopen
      - mineru-miopen-userdb:/root/.config/miopen
      - mineru-output:/data/output
    healthcheck:
      test: ["CMD", "/opt/guangfa-mineru/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 1m

volumes:
  mineru-rocm:
    external: true
    name: guangfa-mineru-rocm
  mineru-runtime:
    external: true
    name: guangfa-mineru-runtime
  mineru-modelscope:
    external: true
    name: guangfa-mineru-modelscope
  mineru-output:
    name: guangfa-mineru-output
  mineru-kernel-cache:
    name: guangfa-mineru-kernel-cache
  mineru-miopen-cache:
    name: guangfa-mineru-miopen-cache
  mineru-miopen-userdb:
    name: guangfa-mineru-miopen-userdb
